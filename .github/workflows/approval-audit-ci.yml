name: Approval Audit CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  approval-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest httpx

      - name: Run approval audit tests
        run: pytest -q tests/test_approval_audit.py tests/test_approval_audit_api.py
