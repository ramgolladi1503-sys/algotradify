name: Lifecycle and Safety CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lifecycle-safety:
    name: Fill lifecycle, outcome replay, approval, and execution-safety tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest httpx

      - name: Run lifecycle and safety tests
        run: |
          pytest -q \
            tests/test_fill_lifecycle.py \
            tests/test_outcome_replay.py \
            tests/test_execution_safety.py \
            tests/test_approval_audit.py \
            tests/test_approval_audit_api.py \
            tests/test_approval_creation.py
