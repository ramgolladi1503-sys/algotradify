name: Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  portfolio-quality-gate:
    name: Documentation, runtime, preflight, strategy, candidate-truth, opportunity-layer, broker-contract, market-readiness, execution-readiness, evidence-wiring, trade-quality, top-selector, fill-lifecycle, outcome-replay, execution-safety, dry-run-execution, API, WebSocket, schema, and portfolio quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required portfolio files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/algotradify-architecture.svg
          test -f docs/one-pagers/sdet-platform-portfolio.md
          test -f docs/test-reports/README.md
          test -f docs/execution-safety-design.md
          test -f docs/dry-run-execution-adapter.md
          test -f docs/dry-run-api-mount.md
          test -f docs/dry-run-control-tower-visibility.md
          test -f docs/replay-contract-index.md
          test -f docs/replay-contract-health-badge.md
          test -f docs/replay-query-api.md
          test -f docs/replay-timeline-ui.md
          test -f docs/replay-result-drilldown-ux.md
          test -f docs/replay-analytics-summary-panel.md
          test -f docs/replay-export-snapshot-panel.md
          test -f docs/replay-evidence-regression-fixtures.md
          test -f docs/replay-fixture-api-contract-tests.md
          test -f docs/replay-fixture-ui-snapshot-contracts.md
          test -f docs/ci-test-suite-map.md
          test -f .github/workflows/core-unit-ci.yml
          test -f .github/workflows/lifecycle-safety-ci.yml
          test -f .github/workflows/api-contract-ci.yml
          test -f .github/workflows/frontend-contract-ci.yml
          test -f .github/workflows/dry-run-execution-ci.yml
          test -f runtime_contract.py
          test -f scripts/preflight_runtime.py
          test -f strategies/base.py
          test -f strategies/registry.py
          test -f candidate_truth/layer.py
          test -f opportunity_layer/pipeline.py
          test -f broker_contract/resolver.py
          test -f broker_contract/readiness.py
          test -f market_readiness/quote_liquidity.py
          test -f execution_readiness/contract.py
          test -f trade_quality/scoring.py
          test -f top_selector/selector.py
          test -f fill_lifecycle/lifecycle.py
          test -f outcome_replay/replay.py
          test -f outcome_replay/query.py
          test -f execution_safety/contract.py
          test -f dry_run_execution/adapter.py
          test -f api/__init__.py
          test -f api/dry_run_execution_route.py
          test -f api/server_with_dry_run.py
          test -f frontend/main.jsx
          test -f api/schemas.py
          test -f tests/test_runtime_contract.py
          test -f tests/test_runtime_preflight.py
          test -f tests/test_strategy_registry.py
          test -f tests/test_candidate_truth.py
          test -f tests/test_opportunity_layer.py
          test -f tests/test_broker_contract_resolver.py
          test -f tests/test_broker_contract_readiness.py
          test -f tests/test_market_readiness.py
          test -f tests/test_execution_readiness.py
          test -f tests/test_execution_readiness_api.py
          test -f tests/test_execution_readiness_evidence_wiring.py
          test -f tests/test_trade_quality.py
          test -f tests/test_trade_quality_api.py
          test -f tests/test_top_selector.py
          test -f tests/test_top_selector_api.py
          test -f tests/test_fill_lifecycle.py
          test -f tests/test_fill_lifecycle_api.py
          test -f tests/test_outcome_replay.py
          test -f tests/test_outcome_replay_query.py
          test -f tests/test_outcome_replay_api.py
          test -f tests/test_outcome_replay_api_query.py
          test -f tests/test_replay_evidence_fixtures.py
          test -f tests/test_replay_fixture_api_contracts.py
          test -f tests/test_replay_fixture_ui_snapshot_contracts.py
          test -f tests/test_replay_contract_health_badge.py
          test -f tests/test_execution_safety.py
          test -f tests/test_execution_safety_api.py
          test -f tests/test_dry_run_execution_adapter.py
          test -f tests/test_dry_run_execution_api.py
          test -f tests/test_dry_run_execution_api_mount.py
          test -f tests/test_dry_run_execution_api_direct_mount.py
          test -f tests/test_control_tower_ui.py
          test -f tests/test_api_contracts.py
          test -f tests/test_websocket_contracts.py
          test -f tests/test_api_schema_contracts.py

      - name: Check README sections
        run: |
          set -euo pipefail
          grep -qi "Problem statement" README.md
          grep -qi "Architecture" README.md
          grep -qi "Canonical runtime command" README.md
          grep -qi "Runtime root priority" README.md
          grep -qi "Runtime preflight" README.md
          grep -qi "Strategy contract" README.md
          grep -qi "Candidate Truth Layer" README.md
          grep -qi "Opportunity Layer" README.md
          grep -qi "Broker contract resolver" README.md
          grep -qi "Broker contract readiness" README.md
          grep -qi "Quote freshness and liquidity gates" README.md
          grep -qi "Unified execution readiness contract" README.md
          grep -qi "Execution readiness API" README.md
          grep -qi "Runtime evidence wiring" README.md
          grep -qi "Trade quality score" README.md
          grep -qi "Top executable selector" README.md
          grep -qi "Fill lifecycle sync" README.md
          grep -qi "Outcome logging and replay" README.md
          grep -qi "Replay drilldowns and outcome analytics UI" README.md
          grep -qi "Richer frontend filtering and outcome analytics charts" README.md
          grep -qi "Persisted UI preferences and operator views" README.md
          grep -qi "Production execution-safety design" README.md
          grep -qi "Execution-safety API and UI visibility" README.md
          grep -qi "Control Tower UI" README.md
          grep -qi "Test strategy" README.md
          grep -qi "Failure modes" README.md
          grep -qi "Roadmap" README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest httpx

      - name: Run runtime, preflight, strategy, candidate-truth, opportunity-layer, broker-contract, market-readiness, execution-readiness, evidence-wiring, trade-quality, top-selector, fill-lifecycle, outcome-replay, execution-safety, dry-run-execution, API, WebSocket, and schema contract tests
        run: pytest -q tests/test_runtime_contract.py tests/test_runtime_preflight.py tests/test_strategy_registry.py tests/test_candidate_truth.py tests/test_opportunity_layer.py tests/test_broker_contract_resolver.py tests/test_broker_contract_readiness.py tests/test_market_readiness.py tests/test_execution_readiness.py tests/test_execution_readiness_api.py tests/test_execution_readiness_evidence_wiring.py tests/test_trade_quality.py tests/test_trade_quality_api.py tests/test_top_selector.py tests/test_top_selector_api.py tests/test_fill_lifecycle.py tests/test_fill_lifecycle_api.py tests/test_outcome_replay.py tests/test_outcome_replay_query.py tests/test_outcome_replay_api.py tests/test_outcome_replay_api_query.py tests/test_replay_evidence_fixtures.py tests/test_replay_fixture_api_contracts.py tests/test_replay_fixture_ui_snapshot_contracts.py tests/test_replay_contract_health_badge.py tests/test_execution_safety.py tests/test_execution_safety_api.py tests/test_dry_run_execution_adapter.py tests/test_dry_run_execution_api.py tests/test_dry_run_execution_api_mount.py tests/test_dry_run_execution_api_direct_mount.py tests/test_control_tower_ui.py tests/test_api_contracts.py tests/test_websocket_contracts.py tests/test_api_schema_contracts.py

      - name: Generate portfolio test report
        run: |
          mkdir -p reports
          cat > reports/portfolio-ci-report.md <<'REPORT'
          # Portfolio CI Report — Algotradify

          ## Scope

          This CI gate validates runtime-root, runtime-preflight, strategy-contract, candidate-truth, opportunity-layer, broker-contract resolver/readiness, market-readiness, execution-readiness, runtime evidence wiring, trade-quality, top-selector, fill-lifecycle, outcome-replay, execution-safety, dry-run execution adapter/API mounts, FastAPI, WebSocket, and schema contract tests.

          ## Checks

          - README exists and documents required architecture sections.
          - Runtime contract and preflight tests run.
          - Strategy registry tests run.
          - Candidate Truth Layer tests run.
          - Opportunity Layer tests run.
          - Broker contract resolver/readiness tests run.
          - Market readiness tests run.
          - Execution readiness tests prove only the unified contract can set `execution_allowed=true` and missing risk blocks by default.
          - Runtime evidence wiring tests prove broker/market/risk artifacts can unlock readiness only when all evidence is present and valid.
          - Trade quality tests prove blocked candidates score zero and allowed candidates are ranked without creating orders.
          - Top executable selector tests prove only execution-allowed quality candidates can be selected, without creating orders.
          - Fill lifecycle tests prove order/fill evidence can be normalized without submitting orders.
          - Outcome replay tests prove candidate outcomes can be audited without order actions.
          - Outcome replay query tests prove replay can be filtered without mutating runtime or creating order actions.
          - Replay evidence fixture tests prove empty, single-candidate, and mixed-status replay cases stay deterministic.
          - Replay fixture API contract tests prove fixture-backed /outcome-replay responses stay stable.
          - Replay fixture UI snapshot contract tests prove fixture-backed Control Tower replay terms stay stable.
          - Replay contract health badge tests prove Control Tower surfaces the replay contract index and remains read-only.
          - Execution safety tests prove manual approval, kill switch, loss/order/quantity guards, dry-run and broker-confirmation gates block execution by default.
          - Dry-run execution tests prove preview-only evidence creation, append-only JSONL persistence, safe flags, and direct API mount behavior.
          - Execution safety API/UI tests prove safety decisions are visible but do not trigger orders.
          - FastAPI, WebSocket, and OpenAPI schema contract tests run.

          ## Current honest limitation

          Execution safety and dry-run execution are visibility/evidence layers. They do not place orders, call broker APIs, or expose execution buttons.
          REPORT

      - name: Upload portfolio report
        uses: actions/upload-artifact@v4
        with:
          name: algotradify-portfolio-ci-report
          path: reports/portfolio-ci-report.md