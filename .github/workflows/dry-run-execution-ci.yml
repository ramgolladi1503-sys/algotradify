name: Dry-Run Execution CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dry-run-execution:
    name: Dry-run adapter and API mount tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt pytest httpx

      - name: Validate dry-run execution files
        run: |
          set -euo pipefail
          test -f dry_run_execution/adapter.py
          test -f api/dry_run_execution_route.py
          test -f api/server_with_dry_run.py
          test -f docs/dry-run-execution-adapter.md
          test -f docs/dry-run-api-mount.md
          test -f tests/test_dry_run_execution_adapter.py
          test -f tests/test_dry_run_execution_api.py
          test -f tests/test_dry_run_execution_api_mount.py
          test -f tests/test_dry_run_execution_api_direct_mount.py

      - name: Run dry-run execution tests
        run: pytest -q tests/test_dry_run_execution_adapter.py tests/test_dry_run_execution_api.py tests/test_dry_run_execution_api_mount.py tests/test_dry_run_execution_api_direct_mount.py
