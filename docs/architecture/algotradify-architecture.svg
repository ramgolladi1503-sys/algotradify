<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Algotradify architecture diagram">
  <defs>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#0f172a}.sub{font:400 16px Arial,Helvetica,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}.api{fill:#eef2ff;stroke:#4338ca;stroke-width:2;rx:16}.ui{fill:#ecfdf5;stroke:#047857;stroke-width:2;rx:16}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:16}.text{font:700 16px Arial,Helvetica,sans-serif;fill:#111827}.small{font:400 13px Arial,Helvetica,sans-serif;fill:#374151}.arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="60" y="58" class="title">Algotradify — Runtime Bridge &amp; Live Monitoring UI</text>
  <text x="60" y="86" class="sub">FastAPI + React observability layer for real-time trading runtimes, API contracts, WebSockets, and graceful degradation.</text>

  <rect x="70" y="155" width="210" height="100" class="box"/><text x="111" y="190" class="text">Core Bot Runtime</text><text x="113" y="217" class="small">signals / cycles / state</text><text x="107" y="235" class="small">loaded by live wrapper</text>
  <rect x="350" y="115" width="210" height="100" class="box"/><text x="391" y="150" class="text">Runtime Artifacts</text><text x="396" y="177" class="small">.runtime snapshots</text><text x="399" y="195" class="small">health / opportunities</text>
  <rect x="350" y="270" width="210" height="100" class="warn"/><text x="407" y="305" class="text">Redis Events</text><text x="405" y="332" class="small">tradebot_events</text><text x="401" y="350" class="small">optional dependency</text>
  <rect x="640" y="190" width="230" height="120" class="api"/><text x="694" y="225" class="text">FastAPI Bridge</text><text x="686" y="252" class="small">REST health endpoints</text><text x="688" y="270" class="small">snapshot ingestion</text><text x="686" y="288" class="small">WebSocket stream</text>
  <rect x="970" y="190" width="230" height="120" class="ui"/><text x="1030" y="225" class="text">React / Vite UI</text><text x="1025" y="252" class="small">runtime health</text><text x="1027" y="270" class="small">opportunities</text><text x="1025" y="288" class="small">live event feed</text>

  <path d="M280 190 H350" class="arrow"/><path d="M280 220 C310 250 320 310 350 320" class="arrow"/>
  <path d="M560 165 C610 175 620 220 640 232" class="arrow"/><path d="M560 320 C610 310 620 278 640 266" class="arrow"/>
  <path d="M870 230 H970" class="arrow"/><path d="M870 275 H970" class="arrow"/>

  <rect x="170" y="500" width="220" height="100" class="api"/><text x="220" y="535" class="text">API Tests</text><text x="217" y="562" class="small">contract checks</text><text x="206" y="580" class="small">degraded responses</text>
  <rect x="530" y="500" width="220" height="100" class="warn"/><text x="577" y="535" class="text">WebSocket Tests</text><text x="582" y="562" class="small">event shape</text><text x="570" y="580" class="small">Redis unavailable</text>
  <rect x="890" y="500" width="220" height="100" class="ui"/><text x="941" y="535" class="text">UI Tests</text><text x="928" y="562" class="small">empty/error states</text><text x="935" y="580" class="small">dashboard truth</text>

  <path d="M755 310 C720 405 300 405 280 500" class="arrow"/><path d="M755 310 C750 400 650 415 640 500" class="arrow"/><path d="M1085 310 C1080 400 1010 415 1000 500" class="arrow"/>
</svg>
